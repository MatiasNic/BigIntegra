name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PySide6/PySide6-Addons no hacen falta: app/engine (lo único testeado
          # en CI) no depende de la GUI, y evita instalar Qt en el runner.
          grep -v -i '^PySide6' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest
